x-env-loader: &env-loader
  env_file:
    - .env.config

x-logging: &logging
  logging:
    driver: fluentd
    options:
      fluentd-address: localhost:24224
      fluentd-async: "true"
      tag: "docker.{{.Name}}"
      fluentd-sub-second-precision: "true"

services:
  ros2:
    image: us-docker.pkg.dev/practical-cider-485717-k0/prod-images/ros2:${VERSION:-1.2.7}
    <<: [*env-loader, *logging]
    platform: linux/amd64
    environment:
      - INFLUXDB_URL=http://host.docker.internal:8086
      - INFLUXDB_ORG=anvil
      - INFLUXDB_BUCKET=workcell
      - INFLUXDB_TOKEN=anvil-workcell
      - DEVICE_NAME
      - VERSION=${VERSION:-1.2.7}
      - VR_HEADSET_TYPE=      # prevent recorder from subscribing to /xr_pose via VR_HEADSET_TYPE
      - AMENT_PREFIX_PATH=/xr_ws_shared/xr_msgs  # expose xr_msgs to recorder + replay_buffer
      - LD_LIBRARY_PATH=/xr_ws_shared/xr_msgs/lib  # dynamic linker path for xr_msgs .so files
    volumes:
      - ./config:/config
      - ./data:/data
      - robot-meshes:/robot-meshes
      - ./.env.config:/env.config:rw
      - /etc/machine-id:/etc/machine-id:ro
      - /etc/anvil-os-version:/etc/anvil-os-version:ro
      - /etc/anvil-os-builder-commit:/etc/anvil-os-builder-commit:ro
      - .git:/repo-git:ro
      - ./.android:/root/.android
      - /run/cameras:/run/cameras:ro
      # Live USB bus so udev hotplug nodes propagate into the container
      - /dev/bus/usb:/dev/bus/usb:rshared
      - ./docker/xr_ws_shared:/xr_ws_shared:ro
      - ./scripts:/scripts:ro  # record_motion_standalone.py / replay_motion.py
    tmpfs:
      - /anvil-tmp:size=5G
    privileged: true
    network_mode: host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    post_start:
      - command: /post_start.sh
    pre_stop:
      - command: /pre_stop.sh
    stop_signal: SIGINT
    stop_grace_period: 45s

  webapps:
    image: us-docker.pkg.dev/practical-cider-485717-k0/prod-images/webapps:${VERSION:-1.2.7}
    <<: [*env-loader, *logging]
    ports:
      - 3000:3000
    environment:
      - VERSION=${VERSION:-1.2.7}
      - NODE_ENV=production
      - DATA_DIR=/data
      - MIGRATIONS_FOLDER=/app/migrations
      - ROS_WS_ENDPOINT=ws://host.docker.internal:9090
      - MESH_DIR=/meshes
    volumes:
      - ./data:/data
      - robot-meshes:/meshes:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /etc/anvil-os-version:/etc/anvil-os-version:ro
      - /etc/anvil-os-builder-commit:/etc/anvil-os-builder-commit:ro
      - ./docker/xr-pc-service/webapp-server-patch.js:/app/dist/server.js:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - workcell-network
    depends_on:
      ros2:
        condition: service_started
    restart: unless-stopped
    post_start:
      - command: /post_start.sh
    pre_stop:
      - command: /pre_stop.sh

  influxdb:
    image: us-docker.pkg.dev/practical-cider-485717-k0/prod-images/influxdb:${VERSION:-1.2.7}
    <<: *logging
    user: "0:0"
    ports:
      - 8086:8086
    volumes:
      - ./data/influxdb3:/var/lib/influxdb3
      - /etc/machine-id:/etc/machine-id:ro
    depends_on:
      fluent-bit:
        condition: service_healthy
    environment:
      - INFLUXDB_PORT=8086
      - INFLUXDB_CLOUD_URL
      - INFLUXDB_CLOUD_BUCKET
      - INFLUXDB_CLOUD_TOKEN
    networks:
      - workcell-network
    post_start:
      - command: /post_start.sh
    pre_stop:
      - command: /pre_stop.sh

  telegraf:
    image: us-docker.pkg.dev/practical-cider-485717-k0/prod-images/telegraf:${VERSION:-1.2.7}
    <<: [*env-loader, *logging]
    user: telegraf:444
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /run/udev:/run/udev:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /etc/anvil-os-version:/etc/anvil-os-version:ro
      - /etc/anvil-os-builder-commit:/etc/anvil-os-builder-commit:ro
      - .git:/repo-git:ro
    environment:
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
      - ROS_WS_ENDPOINT=ws://host.docker.internal:9090
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_ORG=anvil
      - INFLUXDB_BUCKET=workcell
      - INFLUXDB_TOKEN=anvil-workcell
      - DEVICE_NAME
      - VERSION=${VERSION:-1.2.7}
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - workcell-network
    depends_on:
      fluent-bit:
        condition: service_healthy
      influxdb:
        condition: service_started
    post_start:
      - command: /post_start.sh
    pre_stop:
      - command: /pre_stop.sh

  fluent-bit:
    image: us-docker.pkg.dev/practical-cider-485717-k0/prod-images/fluent-bit:${VERSION:-1.2.7}
    <<: *env-loader
    ports:
      - 24224:24224
      - 2020:2020
    volumes:
      - /var/log:/var/log:ro
      - ./data/fluent-bit:/data
      - /etc/machine-id:/etc/machine-id:ro
      - /etc/anvil-os-version:/etc/anvil-os-version:ro
      - /etc/anvil-os-builder-commit:/etc/anvil-os-builder-commit:ro
      - .git:/repo-git:ro
    environment:
      - DEVICE_NAME
      - VERSION=${VERSION:-1.2.7}
      - GRAFANA_LOKI_HOST
      - GRAFANA_LOKI_USER
      - GRAFANA_LOKI_API_KEY
    command: /fluent-bit/bin/fluent-bit -q -c /fluent-bit/etc/fluent-bit-cloud.conf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - workcell-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:2020/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s
    post_start:
      - command: /post_start.sh
    pre_stop:
      - command: /pre_stop.sh

  xr-pc-service:
    image: us-docker.pkg.dev/practical-cider-485717-k0/prod-images/xr-pc-service:1.1.16
    build:
      context: ./docker/xr-pc-service
      dockerfile: Dockerfile
    profiles: [pico4]
    <<: [*env-loader, *logging]
    network_mode: host
    volumes:
      - /etc/machine-id:/etc/machine-id:ro
    environment:
      - DEVICE_NAME
      - VERSION=1.1.16
      - XRPC_SERVICE_PORT=9100
    depends_on:
      fluent-bit:
        condition: service_healthy
    restart: unless-stopped

  # One-shot init container: extracts xr_msgs (ROS2 message bindings for /xr_pose)
  # from the pico4-teleop image into ./docker/xr_ws_shared/ so the ros2 container
  # can load type support for xr_msgs/msg/Custom. Without this, recorder and
  # replay_buffer crash when they discover /xr_pose on DDS.
  xr-ws-init:
    build:
      context: ./docker/vr-pico4-bridge
      dockerfile: Dockerfile.pico4teleop
      args:
        ROS2_VERSION: ${VERSION:-1.2.7}
    profiles: [pico4]
    entrypoint: bash
    command: -c "cp -rn /xr_ws/install/xr_msgs /out/ 2>/dev/null; echo 'xr_msgs ready'"
    volumes:
      - ./docker/xr_ws_shared:/out
    restart: "no"

  pico4-teleop:
    build:
      context: ./docker/vr-pico4-bridge
      dockerfile: Dockerfile.pico4teleop
      args:
        ROS2_VERSION: ${VERSION:-1.2.7}
    profiles: [pico4]
    env_file:
      - .env.config
    network_mode: host
    environment:
      # explicit values that differ from .env.config defaults or aren't in it
      - VERSION=${VERSION:-1.2.7}
      - WEBAPP_URL=http://127.0.0.1:3000
      - INFLUXDB_URL=http://127.0.0.1:8086
      - INFLUXDB_ORG=anvil
      - INFLUXDB_BUCKET=workcell
      - INFLUXDB_TOKEN=anvil-workcell
    volumes:
      - ./config:/config:ro                           # robot_description.urdf + arm config YAMLs
      - /etc/machine-id:/etc/machine-id:ro            # DEVICE_ID source (read by entrypoint)
      - /etc/anvil-os-version:/etc/anvil-os-version:ro
      - /etc/anvil-os-builder-commit:/etc/anvil-os-builder-commit:ro
      - .git:/repo-git:ro                             # LOADER_REPO_VERSION (git HEAD hash)
    depends_on:
      ros2:
        condition: service_started
      xr-pc-service:
        condition: service_started
    restart: unless-stopped

networks:
  workcell-network:
    driver: bridge

volumes:
  robot-meshes:
